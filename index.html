<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리반 실시간 퀴즈 아레나</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <div class="max-w-5xl mx-auto p-4 md:p-6">
    <!-- 상단 헤더 -->
    <header class="flex flex-wrap justify-between items-center pb-4 mb-6 border-b border-slate-700 gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-amber-400">⚡ 우리반 실시간 퀴즈 아레나</h1>
        <p id="connStatus" class="text-xs text-slate-400 mt-1">서버 연결 확인 중...</p>
      </div>
      <div class="flex gap-2">
        <button onclick="switchRole('player')" id="btnPlayerRole" class="px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white">참가자 화면</button>
        <button onclick="switchRole('host')" id="btnHostRole" class="px-4 py-2 rounded-lg text-sm font-bold bg-slate-700 text-slate-300">사회자 화면 (PIN)</button>
      </div>
    </header>

    <!-- ================= 1. 참가자(학생 20명) 화면 ================= -->
    <section id="playerView" class="max-w-md mx-auto">
      <!-- 입장 카드 -->
      <div id="joinCard" class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
        <h2 class="text-lg font-bold mb-2">👋 퀴즈 참가하기</h2>
        <p class="text-xs text-slate-400 mb-4">본인의 실명이나 닉네임을 입력하고 입장하세요.</p>
        <input id="nicknameInput" type="text" placeholder="이름 입력 (예: 홍길동)" maxlength="10"
          class="w-full p-3 rounded-xl bg-slate-900 border border-slate-600 text-white mb-3 focus:outline-none focus:border-amber-400" />
        <button onclick="joinGame()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl transition">
          입장하기
        </button>
      </div>

      <!-- 정답 제출 카드 -->
      <div id="playCard" class="hidden space-y-4">
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex justify-between items-center">
          <div>
            <span class="text-xs text-slate-400">참가자</span>
            <p id="myNameDisplay" class="text-lg font-bold text-amber-400">-</p>
          </div>
          <div class="text-right">
            <span class="text-xs text-slate-400">내 누적 점수</span>
            <p id="myScoreDisplay" class="text-2xl font-extrabold text-white">0점</p>
          </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
          <div class="flex justify-between items-center mb-3">
            <span id="playerRoundBadge" class="px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-full text-xs font-bold">ROUND 1</span>
            <span id="playerModeBadge" class="px-3 py-1 bg-amber-500/20 text-amber-300 rounded-full text-xs font-bold">선착순 모드</span>
          </div>
          <p id="playerPromptText" class="text-base font-bold text-slate-200 mb-4">문제를 듣고 정답을 입력하세요!</p>

          <!-- 열려있을 때 -->
          <div id="answerInputBox">
            <input id="answerInput" type="text" placeholder="정답을 입력하세요" autocomplete="off"
              onkeydown="if(event.key==='Enter') submitAnswer()"
              class="w-full p-4 rounded-xl bg-slate-900 border border-slate-600 text-white text-lg mb-3 focus:outline-none focus:border-amber-400" />
            <button onclick="submitAnswer()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 font-extrabold rounded-xl text-lg transition shadow-lg">
              🚀 정답 제출!
            </button>
          </div>

          <!-- 제출 완료 후 / 잠겼을 때 상태 표시 -->
          <div id="answerStatusBox" class="hidden p-4 rounded-xl bg-slate-900/90 border border-slate-700 text-center">
            <p id="answerStatusMsg" class="font-bold text-emerald-400">제출 완료!</p>
            <p id="mySubmittedAnswer" class="text-xs text-slate-400 mt-1"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 2. 사회자(진행자) 화면 ================= -->
    <section id="hostView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 좌측: 컨트롤 및 실시간 제출 현황 (2칸) -->
      <div class="lg:col-span-2 space-y-6">
        <!-- 라운드 및 모드 설정 -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
          <div class="flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-2">
              <span class="text-lg font-extrabold text-amber-400" id="hostRoundTitle">ROUND 1</span>
              <button onclick="nextRound()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold">다음 라운드 (+1) & 답안 비우기</button>
            </div>
            <div class="flex items-center gap-2">
              <select id="modeSelect" onchange="updateQuizConfig()" class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm font-bold text-amber-300">
                <option value="fcfs">⚡ 선착순 모드 (빠른 순 정렬)</option>
                <option value="score">🎯 점수제 모드 (일괄 채점)</option>
              </select>
              <select id="pointSelect" onchange="updateQuizConfig()" class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm font-bold text-emerald-300">
                <option value="10">+10점</option>
                <option value="20">+20점</option>
                <option value="30">+30점</option>
                <option value="50">+50점</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <input id="promptInput" type="text" placeholder="안내 문구 (예: 노래 제목과 가수를 적어주세요)"
              onblur="updateQuizConfig()"
              class="md:col-span-2 p-3 rounded-xl bg-slate-900 border border-slate-600 text-sm text-white" />
            <input id="correctAnswerInput" type="text" placeholder="자동채점 정답 (선택)"
              class="p-3 rounded-xl bg-slate-900 border border-slate-600 text-sm text-emerald-300" />
          </div>

          <div class="flex flex-wrap gap-2 pt-2">
            <button id="btnToggleOpen" onclick="toggleAnswerOpen()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-sm">
              🔓 정답 제출 열기 (카운트 시작)
            </button>
            <button id="btnToggleBlind" onclick="toggleBlindAnswers()" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-sm">
              🙈 답안 가리기: 켜짐
            </button>
            <button onclick="gradeAllMatching()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm">
              ✅ 정답자 일괄 점수 부여
            </button>
            <button onclick="clearSubmissionsOnly()" class="px-4 py-2.5 bg-rose-600/80 hover:bg-rose-600 rounded-xl font-bold text-sm ml-auto">
              🗑️ 현재 제출목록 초기화
            </button>
          </div>
        </div>

        <!-- 실시간 답안 제출 목록 -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-base">📥 실시간 답안 제출 현황 (<span id="subCount">0</span>명 제출)</h3>
            <span class="text-xs text-slate-400">선착순 0.001초 단위로 자동 정렬됩니다</span>
          </div>
          <div id="submissionList" class="space-y-2 max-h-96 overflow-y-auto">
            <p class="text-sm text-slate-500 text-center py-8">아직 제출된 답안이 없습니다.</p>
          </div>
        </div>
      </div>

      <!-- 우측: 전체 순위표 (1칸) -->
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-base text-amber-400">🏆 실시간 종합 순위 (<span id="playerCount">0</span>명)</h3>
            <button onclick="resetAllScores()" class="text-xs text-rose-400 hover:underline">점수 전체 초기화</button>
          </div>
          <div id="leaderboardList" class="space-y-2 max-h-[480px] overflow-y-auto">
            <p class="text-sm text-slate-500 text-center py-8">입장한 참가자가 없습니다.</p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Firebase SDK 불러오기 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // =========================================================================
    // [중요] 1단계에서 발급받은 본인의 Firebase 설정값을 아래에 붙여넣으세요!
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyA7uECH0W2qDdpz2RNmAdDbwDDTqiQ7f0w",
      authDomain: "quiz-5497e.firebaseapp.com",
      databaseURL: "https://quiz-5497e-default-rtdb.firebaseio.com",
      projectId: "quiz-5497e",
      storageBucket: "quiz-5497e.firebasestorage.app",
      messagingSenderId: "212339612106",
      appId: "1:212339612106:web:522e0594cf9ad10e569733"
    };

    const HOST_PIN = "1234"; // 사회자 화면 진입 비밀번호 (원하는 번호로 변경 가능)

    // 앱 및 DB 초기화
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 로컬 상태
    let myId = localStorage.getItem("quiz_uid") || "u_" + Math.random().toString(36).substring(2, 9);
    localStorage.setItem("quiz_uid", myId);
    let myName = localStorage.getItem("quiz_uname") || "";
    let blindAnswers = true;
    let currentState = { round: 1, mode: "fcfs", points: 10, isOpen: false, openTime: 0, prompt: "문제를 듣고 정답을 입력하세요!" };
    let playersData = {};
    let submissionsData = {};

    // 1. 초기 상태 감시 (퀴즈 설정, 참가자, 제출 답안)
    const stateRef = ref(db, "quiz/state");
    const playersRef = ref(db, "quiz/players");
    const subsRef = ref(db, "quiz/submissions");

    onValue(stateRef, (snap) => {
      document.getElementById("connStatus").innerText = "🟢 실시간 서버 연결됨";
      if (snap.exists()) {
        currentState = snap.val();
      } else {
        set(stateRef, currentState);
      }
      renderStateUI();
    });

    onValue(playersRef, (snap) => {
      playersData = snap.exists() ? snap.val() : {};
      renderLeaderboard();
      renderPlayerSelfInfo();
    });

    onValue(subsRef, (snap) => {
      submissionsData = snap.exists() ? snap.val() : {};
      renderSubmissions();
      renderPlayerSubmissionState();
    });

    // 2. 참가자 입장
    window.joinGame = () => {
      const input = document.getElementById("nicknameInput").value.trim();
      if (!input) return alert("이름을 입력해주세요!");
      myName = input;
      localStorage.setItem("quiz_uname", myName);
      const currentScore = playersData[myId]?.score || 0;
      update(ref(db, `quiz/players/${myId}`), { name: myName, score: currentScore });
      renderPlayerSelfInfo();
    };

    // 3. 정답 제출
    window.submitAnswer = () => {
      if (!currentState.isOpen) return alert("아직 제출 시간이 아닙니다!");
      if (submissionsData[myId]) return alert("이번 라운드에 이미 제출했습니다!");
      const ans = document.getElementById("answerInput").value.trim();
      if (!ans) return alert("정답을 입력해주세요!");

      const now = Date.now();
      const elapsed = currentState.openTime ? ((now - currentState.openTime) / 1000).toFixed(3) : "0.000";

      set(ref(db, `quiz/submissions/${myId}`), {
        name: myName,
        answer: ans,
        timestamp: now,
        elapsed: elapsed,
        rewarded: false
      });
      document.getElementById("answerInput").value = "";
    };

    // 4. 사회자 전환 (PIN 번호 확인)
    window.switchRole = (role) => {
      if (role === "host") {
        const pin = prompt("사회자 비밀번호를 입력하세요 (기본값: 1234)");
        if (pin !== HOST_PIN) return alert("비밀번호가 일치하지 않습니다.");
        document.getElementById("playerView").classList.add("hidden");
        document.getElementById("hostView").classList.remove("hidden");
        document.getElementById("btnHostRole").className = "px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white";
        document.getElementById("btnPlayerRole").className = "px-4 py-2 rounded-lg text-sm font-bold bg-slate-700 text-slate-300";
      } else {
        document.getElementById("hostView").classList.add("hidden");
        document.getElementById("playerView").classList.remove("hidden");
        document.getElementById("btnPlayerRole").className = "px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white";
        document.getElementById("btnHostRole").className = "px-4 py-2 rounded-lg text-sm font-bold bg-slate-700 text-slate-300";
      }
    };

    // 5. 사회자 기능들
    window.updateQuizConfig = () => {
      const mode = document.getElementById("modeSelect").value;
      const points = parseInt(document.getElementById("pointSelect").value, 10);
      const promptText = document.getElementById("promptInput").value.trim() || "문제를 듣고 정답을 입력하세요!";
      update(stateRef, { mode, points, prompt: promptText });
    };

    window.toggleAnswerOpen = () => {
      const nextOpen = !currentState.isOpen;
      update(stateRef, {
        isOpen: nextOpen,
        openTime: nextOpen ? Date.now() : currentState.openTime
      });
    };

    window.nextRound = () => {
      remove(subsRef);
      update(stateRef, {
        round: (currentState.round || 1) + 1,
        isOpen: false
      });
      document.getElementById("correctAnswerInput").value = "";
    };

    window.clearSubmissionsOnly = () => {
      if (confirm("현재 제출된 답안 목록을 지울까요?")) remove(subsRef);
    };

    window.toggleBlindAnswers = () => {
      blindAnswers = !blindAnswers;
      document.getElementById("btnToggleBlind").innerText = blindAnswers ? "🙈 답안 가리기: 켜짐" : "👀 답안 가리기: 꺼짐 (공개됨)";
      renderSubmissions();
    };

    // 개별 정답 인정 (선착순 및 수동 채점용)
    window.awardPoint = (uid) => {
      const sub = submissionsData[uid];
      if (!sub || sub.rewarded) return;
      const pts = Number(currentState.points || 10);
      const curScore = playersData[uid]?.score || 0;
      update(ref(db, `quiz/players/${uid}`), { score: curScore + pts });
      update(ref(db, `quiz/submissions/${uid}`), { rewarded: true });
    };

    // 정답자 일괄 채점 (점수제 및 복수 정답자용)
    window.gradeAllMatching = () => {
      const target = document.getElementById("correctAnswerInput").value.trim().toLowerCase().replace(/\s+/g, "");
      if (!target) return alert("'자동채점 정답' 칸에 정답 텍스트를 먼저 입력해주세요!");
      let count = 0;
      const pts = Number(currentState.points || 10);

      Object.entries(submissionsData).forEach(([uid, sub]) => {
        const userAns = (sub.answer || "").trim().toLowerCase().replace(/\s+/g, "");
        if (!sub.rewarded && userAns === target) {
          const curScore = playersData[uid]?.score || 0;
          update(ref(db, `quiz/players/${uid}`), { score: curScore + pts });
          update(ref(db, `quiz/submissions/${uid}`), { rewarded: true });
          count++;
        }
      });
      blindAnswers = false;
      document.getElementById("btnToggleBlind").innerText = "👀 답안 가리기: 꺼짐 (공개됨)";
      renderSubmissions();
      alert(`총 ${count}명에게 +${pts}점이 부여되었습니다!`);
    };

    window.resetAllScores = () => {
      if (!confirm("모든 참가자의 누적 점수를 0점으로 초기화할까요?")) return;
      Object.keys(playersData).forEach((uid) => {
        update(ref(db, `quiz/players/${uid}`), { score: 0 });
      });
    };

    // UI 렌더링 함수들
    function renderStateUI() {
      // 참가자 쪽 배지
      document.getElementById("playerRoundBadge").innerText = `ROUND ${currentState.round || 1}`;
      document.getElementById("playerModeBadge").innerText = currentState.mode === "fcfs" ? "⚡ 선착순 모드" : "🎯 점수제 모드";
      document.getElementById("playerPromptText").innerText = currentState.prompt || "문제를 듣고 정답을 입력하세요!";

      // 사회자 쪽 컨트롤
      document.getElementById("hostRoundTitle").innerText = `ROUND ${currentState.round || 1}`;
      document.getElementById("modeSelect").value = currentState.mode || "fcfs";
      document.getElementById("pointSelect").value = currentState.points || 10;

      const btnOpen = document.getElementById("btnToggleOpen");
      if (currentState.isOpen) {
        btnOpen.innerText = "🔒 정답 제출 마감하기";
        btnOpen.className = "px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-extrabold text-sm";
      } else {
        btnOpen.innerText = "🔓 정답 제출 열기 (카운트 시작)";
        btnOpen.className = "px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm";
      }
      renderPlayerSubmissionState();
    }

    function renderPlayerSelfInfo() {
      if (myName && playersData[myId]) {
        document.getElementById("joinCard").classList.add("hidden");
        document.getElementById("playCard").classList.remove("hidden");
        document.getElementById("myNameDisplay").innerText = playersData[myId].name;
        document.getElementById("myScoreDisplay").innerText = `${playersData[myId].score || 0}점`;
      }
    }

    function renderPlayerSubmissionState() {
      const inputBox = document.getElementById("answerInputBox");
      const statusBox = document.getElementById("answerStatusBox");
      const statusMsg = document.getElementById("answerStatusMsg");
      const mySubAns = document.getElementById("mySubmittedAnswer");

      const mySub = submissionsData[myId];
      if (mySub) {
        inputBox.classList.add("hidden");
        statusBox.classList.remove("hidden");
        statusMsg.innerText = mySub.rewarded ? `🎉 정답 인정! (+${currentState.points}점 획득)` : `✅ 제출 완료! (${mySub.elapsed}초)`;
        statusMsg.className = mySub.rewarded ? "font-extrabold text-amber-400 text-lg" : "font-bold text-emerald-400";
        mySubAns.innerText = `내 제출 답안: ${mySub.answer}`;
      } else if (!currentState.isOpen) {
        inputBox.classList.add("hidden");
        statusBox.classList.remove("hidden");
        statusMsg.innerText = "⏳ 사회자가 정답 제출을 열 때까지 대기 중...";
        statusMsg.className = "font-bold text-slate-400";
        mySubAns.innerText = "";
      } else {
        inputBox.classList.remove("hidden");
        statusBox.classList.add("hidden");
      }
    }

    function renderSubmissions() {
      const listEl = document.getElementById("submissionList");
      const entries = Object.entries(submissionsData).sort((a, b) => a[1].timestamp - b[1].timestamp);
      document.getElementById("subCount").innerText = entries.length;

      if (entries.length === 0) {
        listEl.innerHTML = `<p class="text-sm text-slate-500 text-center py-8">아직 제출된 답안이 없습니다.</p>`;
        return;
      }

      listEl.innerHTML = entries.map(([uid, sub], idx) => {
        const rankBadge = idx === 0 ? "🥇 1등" : `${idx + 1}위`;
        const ansText = blindAnswers ? "🔒 [가려짐]" : sub.answer;
        const btnHtml = sub.rewarded
          ? `<span class="px-3 py-1 bg-emerald-500/20 text-emerald-300 rounded-lg text-xs font-bold">지급 완료</span>`
          : `<button onclick="awardPoint('${uid}')" class="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg text-xs font-extrabold">+${currentState.points}점 부여</button>`;

        return `
          <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border ${idx === 0 ? 'border-amber-500/60' : 'border-slate-700'}">
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 rounded-md text-xs font-extrabold ${idx === 0 ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}">${rankBadge}</span>
              <div>
                <p class="font-bold text-sm text-white">${sub.name} <span class="text-xs text-slate-400 font-normal">(${sub.elapsed}초)</span></p>
                <p class="text-sm font-bold ${blindAnswers ? 'text-slate-500' : 'text-amber-300'} mt-0.5">${ansText}</p>
              </div>
            </div>
            <div>${btnHtml}</div>
          </div>
        `;
      }).join("");
    }

    function renderLeaderboard() {
      const listEl = document.getElementById("leaderboardList");
      const entries = Object.entries(playersData).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
      document.getElementById("playerCount").innerText = entries.length;

      if (entries.length === 0) {
        listEl.innerHTML = `<p class="text-sm text-slate-500 text-center py-8">입장한 참가자가 없습니다.</p>`;
        return;
      }

      listEl.innerHTML = entries.map(([uid, p], idx) => {
        const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx + 1}.`;
        return `
          <div class="flex justify-between items-center p-3 rounded-xl bg-slate-900 border border-slate-700">
            <span class="font-bold text-sm"><span class="mr-2">${medal}</span>${p.name}</span>
            <span class="font-extrabold text-amber-400">${p.score || 0}점</span>
          </div>
        `;
      }).join("");
    }
  </script>
</body>
</html>
